[workspace]
name = "futebol-python"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = "3.12.*"
pandas = ">=2.2,<3"
matplotlib = "*"
ipython = "*"
ipywidgets = "*"
ipykernel = "*"
nbformat = "*"
nbclient = "*"
nbstripout = "*"
pytest = "*"
requests = "*"
pillow = "*"

[tasks]
testes = "pytest -q tests"
testar-notebooks = "python scripts/testar_notebooks.py"
preparar-dados = "python scripts/preparar_dados.py"
verificar-curiosidades = "python scripts/verificar_curiosidades.py"
checar-idioma = "python scripts/checar_idioma.py"
sincronizar-som = "python scripts/sincronizar_som.py"
comprimir-gifs = "python scripts/comprimir_gifs.py"
construir-site = "python scripts/construir_site.py"
site = { cmd = "python -m http.server 8000 -d site", depends-on = ["construir-site"] }
verificar = { depends-on = ["testes", "checar-idioma", "construir-site", "testar-notebooks"] }
