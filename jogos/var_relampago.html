<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAR Relâmpago</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{background:#283593;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#13213c;display:flex;justify-content:center;overflow:hidden}
#app{position:relative;width:100%;max-width:520px;height:100%;max-height:560px;min-height:420px;display:flex;flex-direction:column;background:linear-gradient(#e8eaf6,#c5cae9);overflow:hidden}
.barra{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:800;font-size:20px;background:#3949ab;color:#fff;z-index:5}
.tela{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;background:#fff8e1f7;z-index:20}
.tela h1{font-size:38px;color:#283593}
.tela p{font-size:20px;max-width:420px;line-height:1.35}
.grande{font-size:64px}
.escondido{display:none!important}
.botao{min-height:60px;min-width:180px;padding:12px 30px;font-size:26px;font-weight:900;border:0;border-radius:999px;background:#ffd600;color:#13213c;box-shadow:0 6px 0 #c79f00;cursor:pointer;font-family:inherit}
.botao:active{transform:translateY(4px);box-shadow:0 2px 0 #c79f00}
.botao:disabled{opacity:.5}
#jogo{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px;min-height:0}
#regra{background:#13213c;color:#fff;border-radius:14px;padding:10px 12px;font-size:18px;font-weight:800;text-align:center;line-height:1.35}
#regra .op{color:#ffd600;font-weight:900}
#lance{flex:1;background:#fff;border-radius:16px;box-shadow:0 4px 0 #0002;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:0}
#lance .titulo{font-size:17px;font-weight:900;color:#3949ab;text-align:center}
.fato{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:700;padding:6px 10px;border-radius:10px;background:#f5f5f5}
.fato .sim{color:#1b5e20;font-weight:900}
.fato .nao{color:#b71c1c;font-weight:900}
#aviso{text-align:center;font-size:19px;font-weight:900;min-height:50px;color:#283593;line-height:1.3}
#aviso.certo{color:#1b5e20}
#aviso.quase{color:#bf360c}
#botoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.decisao{min-height:72px;border:0;border-radius:16px;font-family:inherit;font-size:22px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 5px 0 #0003}
.decisao:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
#penal{background:#2e7d32}
#naofoi{background:#c62828}
.som{min-width:48px;min-height:48px;border:0;border-radius:12px;background:#ffffffdd;font-size:24px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="app">
  <div class="barra"><span>⏱️ <span id="tempo">45</span>s</span><span>📺 Acertos: <span id="placar">0</span></span><button class="som" id="som" aria-label="Ligar o som">🔇</button></div>
  <div id="jogo">
    <div id="regra"></div>
    <div id="lance"></div>
    <div id="aviso"></div>
    <div id="botoes">
      <button class="decisao" id="penal">⚽ PÊNALTI</button>
      <button class="decisao" id="naofoi">✋ NÃO FOI</button>
    </div>
  </div>

  <div id="inicio" class="tela">
    <div class="grande">📺🟨</div>
    <h1>VAR Relâmpago</h1>
    <p>Leia a regra lá em cima. Olhe o lance. Foi pênalti ou não foi? Decida rápido!</p>
    <button class="botao" id="jogar">Jogar</button>
  </div>

  <div id="fim" class="tela escondido">
    <div class="grande">📺</div>
    <h1>Fim de jogo!</h1>
    <p id="resultado"></p>
    <p id="aura"></p>
    <button class="botao" id="denovo">Jogar de novo</button>
  </div>
</div>
<script>
/* SOM-INICIO: copiado de midia/som.js por scripts/sincronizar_som.py (edite lá, não aqui) */
// Sons sintetizados na hora com a Web Audio do navegador: nenhum arquivo, nenhuma rede.
// Começa ligado (quem decide é quem usa). Cada som dura menos de 1 segundo.
var Som = (function () {
  var ctx = null, ligado = false;

  function contexto() {
    if (!ctx) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  // Uma nota: frequência (Hz), começo e duração (s), tipo de onda, volume e frequência final.
  function nota(c, freq, inicio, dur, tipo, vol, freqFim) {
    var t = c.currentTime + inicio, osc = c.createOscillator(), g = c.createGain();
    osc.type = tipo || "sine";
    osc.frequency.setValueAtTime(freq, t);
    if (freqFim) osc.frequency.exponentialRampToValueAtTime(freqFim, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }

  // Chiado filtrado (torcida, chute na bola).
  function ruido(c, inicio, dur, vol, freq) {
    var t = c.currentTime + inicio, n = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    var fonte = c.createBufferSource(), filtro = c.createBiquadFilter(), g = c.createGain();
    fonte.buffer = buf;
    filtro.type = "bandpass"; filtro.frequency.value = freq || 1000;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + dur * 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    fonte.connect(filtro); filtro.connect(g); g.connect(c.destination);
    fonte.start(t); fonte.stop(t + dur);
  }

  var sons = {
    apito: function (c) { nota(c, 2600, 0, 0.18, "square", 0.05); nota(c, 2600, 0.24, 0.4, "square", 0.05); },
    chute: function (c) { ruido(c, 0, 0.07, 0.4, 700); nota(c, 160, 0, 0.12, "sine", 0.4, 60); },
    gol: function (c) {
      [523, 659, 784, 1047].forEach(function (f, i) { nota(c, f, i * 0.09, 0.22, "triangle", 0.18); });
    },
    torcida: function (c) { ruido(c, 0, 0.9, 0.18, 1200); ruido(c, 0.05, 0.8, 0.1, 600); },
    defesa: function (c) { nota(c, 220, 0, 0.15, "sine", 0.3, 90); },
    erro: function (c) { nota(c, 440, 0, 0.16, "triangle", 0.12); nota(c, 370, 0.16, 0.24, "triangle", 0.12); },
    clique: function (c) { nota(c, 880, 0, 0.05, "sine", 0.08); }
  };

  function tocar(nome) {
    if (!ligado || !sons[nome]) return;
    var c = contexto();
    if (!c) return;
    try { sons[nome](c); } catch (e) {}
  }

  // Liga um botão 🔇/🔊 (ele mesmo mostra o estado).
  function botao(el) {
    function pintar() {
      el.textContent = ligado ? "🔊" : "🔇";
      el.setAttribute("aria-label", ligado ? "Desligar o som" : "Ligar o som");
    }
    el.addEventListener("pointerdown", function (e) {
      e.preventDefault(); e.stopPropagation();
      ligado = !ligado;
      if (ligado) { contexto(); tocar("clique"); }
      pintar();
    });
    pintar();
  }

  return {
    tocar: tocar,
    botao: botao,
    ligar: function (sim) { ligado = !!sim; if (ligado) contexto(); },
    ligado: function () { return ligado; }
  };
})();
/* SOM-FIM */
// Configuração enviada pelo notebook (ou valores padrão se abrir sozinho)
var CONFIG = window.CONFIG || {modo: "campeao", dica: "", id: "", nome: "var_relampago"};
var DURACAO = 45;

// Regras do juiz. Cada regra tem os fatos do lance e a conta de lógica (E / OU).
var REGRAS = [
  {
    texto: 'Pênalti se: dentro da área <span class="op">E</span> teve falta',
    fatos: ["Dentro da área", "Teve falta"],
    decide: function (f) { return f[0] && f[1]; },
    explica: "Precisa das duas coisas: dentro da área E falta."
  },
  {
    texto: 'Pênalti se: dentro da área <span class="op">E</span> (falta <span class="op">OU</span> mão)',
    fatos: ["Dentro da área", "Teve falta", "Teve mão"],
    decide: function (f) { return f[0] && (f[1] || f[2]); },
    explica: "Precisa ser dentro da área, e basta falta OU mão."
  },
  {
    texto: 'Pênalti se: dentro da área <span class="op">E</span> mão <span class="op">E</span> braço aberto',
    fatos: ["Dentro da área", "Teve mão", "Braço aberto"],
    decide: function (f) { return f[0] && f[1] && f[2]; },
    explica: "Com E, as três coisas precisam ser SIM."
  },
  {
    texto: 'Pênalti se: teve falta <span class="op">E</span> (dentro da área <span class="op">OU</span> em cima da linha)',
    fatos: ["Teve falta", "Dentro da área", "Em cima da linha"],
    decide: function (f) { return f[0] && (f[1] || f[2]); },
    explica: "Precisa de falta, e basta dentro da área OU em cima da linha."
  },
  {
    texto: 'Pênalti se: (empurrão <span class="op">OU</span> carrinho) <span class="op">E</span> dentro da área',
    fatos: ["Teve empurrão", "Teve carrinho", "Dentro da área"],
    decide: function (f) { return (f[0] || f[1]) && f[2]; },
    explica: "Basta empurrão OU carrinho, mas precisa ser dentro da área."
  }
];
var JOGADORES = ["Ana", "Léo", "Bia", "Caio", "Duda", "Enzo", "Malu", "Theo", "Lara", "Davi", "Nina", "Rafa"];
var TIMES = ["Tigres FC", "Foguete EC", "Tubarões FC", "Cacto Futebol", "Vulcão FC", "Abelhas Unidas"];

function $(id) { return document.getElementById(id); }
function sortear(lista) { return lista[Math.floor(Math.random() * lista.length)]; }

var jogando = false, acertos = 0, fimEm = 0, relogio = null, travado = false, atual = null;

document.addEventListener("dblclick", function (e) { e.preventDefault(); });

function enviarResultado(pontos) {
  try {
    parent.postMessage({tipo: "fim_de_jogo", id: CONFIG.id, modo: CONFIG.modo, nome: CONFIG.nome, pontos: pontos}, "*");
  } catch (e) {}
}

function novoLance() {
  // Sorteia a resposta primeiro (metade pênalti, metade não) e depois fatos que combinam com ela
  var regra = sortear(REGRAS);
  var querPenalti = Math.random() < 0.5;
  var fatos;
  do {
    fatos = regra.fatos.map(function () { return Math.random() < 0.6; });
  } while (regra.decide(fatos) !== querPenalti);
  atual = {regra: regra, fatos: fatos, penalti: querPenalti};
  travado = false;

  $("regra").innerHTML = "📜 " + regra.texto;
  var html = '<div class="titulo">🎥 ' + "Lance de " + sortear(JOGADORES) + " contra " + sortear(TIMES) + "</div>";
  regra.fatos.forEach(function (nome, i) {
    html += '<div class="fato"><span>' + nome + "</span>" +
      (fatos[i] ? '<span class="sim">✅ SIM</span>' : '<span class="nao">❌ NÃO</span>') + "</div>";
  });
  $("lance").innerHTML = html;
  $("aviso").className = "";
  $("aviso").textContent = "Qual é a sua decisão?";
}

function decidir(disse) {
  if (!jogando || travado) return;
  travado = true;
  var aviso = $("aviso");
  if (disse === atual.penalti) {
    acertos++;
    $("placar").textContent = acertos;
    aviso.className = "certo";
    aviso.textContent = atual.penalti ? "Isso! Foi pênalti. ✅" : "Isso! Não foi pênalti. ✅";
    Som.tocar("gol");
    setTimeout(function () { if (jogando) novoLance(); }, 800);
  } else {
    aviso.className = "quase";
    aviso.textContent = "Quase! Olha de novo. " + atual.regra.explica;
    Som.tocar("erro");
    setTimeout(function () { if (jogando) novoLance(); }, 2000);
  }
}

function comecar() {
  Som.tocar("apito");
  acertos = 0; jogando = true;
  $("placar").textContent = "0";
  $("inicio").classList.add("escondido");
  $("fim").classList.add("escondido");
  novoLance();
  fimEm = Date.now() + DURACAO * 1000;
  clearInterval(relogio);
  relogio = setInterval(function () {
    var resta = Math.max(0, Math.ceil((fimEm - Date.now()) / 1000));
    $("tempo").textContent = resta;
    if (resta <= 0) terminar();
  }, 100);
}

function terminar() {
  Som.tocar("apito");
  clearInterval(relogio);
  jogando = false;
  // Aura de 0 a 50: 4 pontos por decisão certa, no máximo 50
  var pontos = CONFIG.modo === "campeao" ? Math.min(50, acertos * 4) : 0;
  $("resultado").textContent = "Você acertou " + acertos + (acertos === 1 ? " decisão" : " decisões") + " do VAR!";
  $("aura").textContent = (pontos > 0 && CONFIG.id) ? "✨ +" + pontos + " de aura! ✨" : "Juiz bom treina muito. Bora de novo!";
  $("fim").classList.remove("escondido");
  var botao = $("denovo");
  botao.disabled = true;
  setTimeout(function () { botao.disabled = false; }, 900);
  enviarResultado(pontos);
}

$("penal").addEventListener("pointerdown", function (e) { e.preventDefault(); decidir(true); });
$("naofoi").addEventListener("pointerdown", function (e) { e.preventDefault(); decidir(false); });
$("jogar").addEventListener("pointerdown", function (e) { e.preventDefault(); comecar(); });
$("denovo").addEventListener("pointerdown", function (e) { e.preventDefault(); if (!this.disabled) comecar(); });
// Som: começa ligado; o botão 🔊/🔇 desliga e liga.
Som.ligar(CONFIG.som !== false);
Som.botao($("som"));
</script>
</body>
</html>
