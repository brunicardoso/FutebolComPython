<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quem é mais eficiente?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{background:#6a1b9a;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#13213c;display:flex;justify-content:center;overflow:hidden}
#app{position:relative;width:100%;max-width:520px;height:100%;max-height:560px;min-height:420px;display:flex;flex-direction:column;background:linear-gradient(#f3e5f5,#e1bee7);overflow:hidden}
.barra{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:800;font-size:20px;background:#8e24aa;color:#fff;z-index:5}
.tela{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;background:#fff8e1f7;z-index:20}
.tela h1{font-size:34px;color:#6a1b9a}
.tela p{font-size:20px;max-width:420px;line-height:1.35}
.grande{font-size:64px}
.escondido{display:none!important}
.botao{min-height:60px;min-width:180px;padding:12px 30px;font-size:26px;font-weight:900;border:0;border-radius:999px;background:#ffd600;color:#13213c;box-shadow:0 6px 0 #c79f00;cursor:pointer;font-family:inherit}
.botao:active{transform:translateY(4px);box-shadow:0 2px 0 #c79f00}
.botao:disabled{opacity:.5}
#jogo{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px;min-height:0}
#pedido{text-align:center;font-size:19px;font-weight:900;color:#4a148c;line-height:1.3}
#cartas{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
.carta{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:4px solid transparent;border-radius:18px;background:#fff;box-shadow:0 5px 0 #0002;font-family:inherit;color:#13213c;cursor:pointer;padding:8px}
.carta:active{transform:translateY(3px)}
.carta .emo{font-size:44px}
.carta .nome{font-size:22px;font-weight:900;color:#6a1b9a}
.carta .num{font-size:18px;font-weight:700}
.carta .num b{font-size:22px}
.carta .por90{font-size:18px;font-weight:900;min-height:24px;color:#4a148c}
.carta.melhor{border-color:#2e7d32;background:#e8f5e9}
.carta.outra{opacity:.75}
#aviso{text-align:center;font-size:19px;font-weight:900;min-height:50px;color:#4a148c;line-height:1.3}
#aviso.certo{color:#1b5e20}
#aviso.quase{color:#bf360c}
.som{min-width:48px;min-height:48px;border:0;border-radius:12px;background:#ffffffdd;font-size:24px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="app">
  <div class="barra"><span>⏱️ <span id="tempo">45</span>s</span><span>🎯 Acertos: <span id="placar">0</span></span><button class="som" id="som" aria-label="Ligar o som">🔇</button></div>
  <div id="jogo">
    <div id="pedido">Quem faz mais gols a cada 90 minutos?</div>
    <div id="cartas">
      <button class="carta" id="carta0"></button>
      <button class="carta" id="carta1"></button>
    </div>
    <div id="aviso"></div>
  </div>

  <div id="inicio" class="tela">
    <div class="grande">🎯⚽</div>
    <h1>Quem é mais eficiente?</h1>
    <p>Não vale só contar gols! Veja quantos gols cada um faz a cada 90 minutos (um jogo inteiro). Toque no mais eficiente.</p>
    <button class="botao" id="jogar">Jogar</button>
  </div>

  <div id="fim" class="tela escondido">
    <div class="grande">🎯</div>
    <h1>Fim de jogo!</h1>
    <p id="resultado"></p>
    <p id="aura"></p>
    <button class="botao" id="denovo">Jogar de novo</button>
  </div>
</div>
<script>
/* SOM-INICIO: copiado de midia/som.js por scripts/sincronizar_som.py (edite lá, não aqui) */
// Sons sintetizados na hora com a Web Audio do navegador: nenhum arquivo, nenhuma rede.
// Começa ligado (quem decide é quem usa). Cada som dura menos de 1 segundo.
var Som = (function () {
  var ctx = null, ligado = false;

  function contexto() {
    if (!ctx) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  // Uma nota: frequência (Hz), começo e duração (s), tipo de onda, volume e frequência final.
  function nota(c, freq, inicio, dur, tipo, vol, freqFim) {
    var t = c.currentTime + inicio, osc = c.createOscillator(), g = c.createGain();
    osc.type = tipo || "sine";
    osc.frequency.setValueAtTime(freq, t);
    if (freqFim) osc.frequency.exponentialRampToValueAtTime(freqFim, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }

  // Chiado filtrado (torcida, chute na bola).
  function ruido(c, inicio, dur, vol, freq) {
    var t = c.currentTime + inicio, n = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    var fonte = c.createBufferSource(), filtro = c.createBiquadFilter(), g = c.createGain();
    fonte.buffer = buf;
    filtro.type = "bandpass"; filtro.frequency.value = freq || 1000;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + dur * 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    fonte.connect(filtro); filtro.connect(g); g.connect(c.destination);
    fonte.start(t); fonte.stop(t + dur);
  }

  var sons = {
    apito: function (c) { nota(c, 2600, 0, 0.18, "square", 0.05); nota(c, 2600, 0.24, 0.4, "square", 0.05); },
    chute: function (c) { ruido(c, 0, 0.07, 0.4, 700); nota(c, 160, 0, 0.12, "sine", 0.4, 60); },
    gol: function (c) {
      [523, 659, 784, 1047].forEach(function (f, i) { nota(c, f, i * 0.09, 0.22, "triangle", 0.18); });
    },
    torcida: function (c) { ruido(c, 0, 0.9, 0.18, 1200); ruido(c, 0.05, 0.8, 0.1, 600); },
    defesa: function (c) { nota(c, 220, 0, 0.15, "sine", 0.3, 90); },
    erro: function (c) { nota(c, 440, 0, 0.16, "triangle", 0.12); nota(c, 370, 0.16, 0.24, "triangle", 0.12); },
    clique: function (c) { nota(c, 880, 0, 0.05, "sine", 0.08); }
  };

  function tocar(nome) {
    if (!ligado || !sons[nome]) return;
    var c = contexto();
    if (!c) return;
    try { sons[nome](c); } catch (e) {}
  }

  // Liga um botão 🔇/🔊 (ele mesmo mostra o estado).
  function botao(el) {
    function pintar() {
      el.textContent = ligado ? "🔊" : "🔇";
      el.setAttribute("aria-label", ligado ? "Desligar o som" : "Ligar o som");
    }
    el.addEventListener("pointerdown", function (e) {
      e.preventDefault(); e.stopPropagation();
      ligado = !ligado;
      if (ligado) { contexto(); tocar("clique"); }
      pintar();
    });
    pintar();
  }

  return {
    tocar: tocar,
    botao: botao,
    ligar: function (sim) { ligado = !!sim; if (ligado) contexto(); },
    ligado: function () { return ligado; }
  };
})();
/* SOM-FIM */
// Configuração enviada pelo notebook (ou valores padrão se abrir sozinho)
var CONFIG = window.CONFIG || {modo: "campeao", dica: "", id: "", nome: "quem_e_mais_eficiente"};
var DURACAO = 45;
// Nomes inventados (nenhum jogador de verdade)
var NOMES = ["Ana", "Léo", "Bia", "Caio", "Duda", "Enzo", "Malu", "Theo", "Lara", "Davi", "Nina", "Rafa", "Iara", "Tito", "Gabi", "Juca"];
var EMOJIS = ["🧒", "👦", "👧", "🧑", "🦸", "🥷"];

function $(id) { return document.getElementById(id); }
function sortear(lista) { return lista[Math.floor(Math.random() * lista.length)]; }

var jogando = false, acertos = 0, fimEm = 0, relogio = null, travado = false, dupla = [];

document.addEventListener("dblclick", function (e) { e.preventDefault(); });

function enviarResultado(pontos) {
  try {
    parent.postMessage({tipo: "fim_de_jogo", id: CONFIG.id, modo: CONFIG.modo, nome: CONFIG.nome, pontos: pontos}, "*");
  } catch (e) {}
}

// Escreve o número com vírgula, como no Brasil (ex.: 1,5)
function numeroBr(x) {
  return (Math.round(x * 100) / 100).toString().replace(".", ",");
}

function novoAtacante(nome) {
  // Minutos sempre múltiplos de 90 (jogos inteiros), para a conta ficar fácil
  var jogos = sortear([1, 2, 3, 4, 5, 6, 8, 10]);
  var gols = Math.floor(Math.random() * (jogos * 2 + 1));
  return {nome: nome, emo: sortear(EMOJIS), jogos: jogos, minutos: jogos * 90, gols: gols, por90: gols / jogos};
}

function novaDupla() {
  // Sorteia dois atacantes com gols por 90 bem diferentes (nunca empate)
  var a, b, nomeA = sortear(NOMES), nomeB;
  do { nomeB = sortear(NOMES); } while (nomeB === nomeA);
  do {
    a = novoAtacante(nomeA);
    b = novoAtacante(nomeB);
  } while (Math.abs(a.por90 - b.por90) < 0.2 || a.minutos === b.minutos);
  dupla = [a, b];
  travado = false;
  dupla.forEach(function (p, i) {
    var carta = $("carta" + i);
    carta.className = "carta";
    carta.innerHTML = '<span class="emo">' + p.emo + '</span><span class="nome">' + p.nome + "</span>" +
      '<span class="num">⚽ <b>' + p.gols + "</b> " + (p.gols === 1 ? "gol" : "gols") + "</span>" +
      '<span class="num">⏱️ <b>' + p.minutos + "</b> min</span>" +
      '<span class="por90"></span>';
  });
  $("aviso").className = "";
  $("aviso").textContent = "";
}

function escolher(i) {
  if (!jogando || travado) return;
  travado = true;
  Som.tocar("chute");
  var melhor = dupla[0].por90 > dupla[1].por90 ? 0 : 1;
  // Mostra a conta de cada um: gols ÷ (minutos ÷ 90)
  dupla.forEach(function (p, k) {
    var carta = $("carta" + k);
    carta.querySelector(".por90").textContent = numeroBr(p.por90) + " por 90 min";
    carta.classList.add(k === melhor ? "melhor" : "outra");
  });
  var aviso = $("aviso");
  var m = dupla[melhor];
  if (i === melhor) {
    acertos++;
    $("placar").textContent = acertos;
    aviso.className = "certo";
    aviso.textContent = "Isso! " + m.nome + " faz " + numeroBr(m.por90) + " gol a cada 90 minutos. ✅";
    Som.tocar("gol");
    setTimeout(function () { if (jogando) novaDupla(); }, 1300);
  } else {
    aviso.className = "quase";
    aviso.textContent = "Quase! Olha de novo. " + m.nome + " fez " + m.gols + (m.gols === 1 ? " gol" : " gols") + " em " + m.jogos + (m.jogos === 1 ? " jogo" : " jogos") + " = " + numeroBr(m.por90) + " por 90 min.";
    Som.tocar("defesa");
    setTimeout(function () { if (jogando) novaDupla(); }, 2300);
  }
}

function comecar() {
  Som.tocar("apito");
  acertos = 0; jogando = true;
  $("placar").textContent = "0";
  $("inicio").classList.add("escondido");
  $("fim").classList.add("escondido");
  novaDupla();
  fimEm = Date.now() + DURACAO * 1000;
  clearInterval(relogio);
  relogio = setInterval(function () {
    var resta = Math.max(0, Math.ceil((fimEm - Date.now()) / 1000));
    $("tempo").textContent = resta;
    if (resta <= 0) terminar();
  }, 100);
}

function terminar() {
  Som.tocar("apito");
  clearInterval(relogio);
  jogando = false;
  // Aura de 0 a 50: 4 pontos por escolha certa, no máximo 50
  var pontos = CONFIG.modo === "campeao" ? Math.min(50, acertos * 4) : 0;
  $("resultado").textContent = "Você achou " + acertos + (acertos === 1 ? " atacante mais eficiente" : " atacantes mais eficientes") + "!";
  $("aura").textContent = (pontos > 0 && CONFIG.id) ? "✨ +" + pontos + " de aura! ✨" : "Olheiro bom faz a conta com calma. Bora de novo!";
  $("fim").classList.remove("escondido");
  var botao = $("denovo");
  botao.disabled = true;
  setTimeout(function () { botao.disabled = false; }, 900);
  enviarResultado(pontos);
}

$("carta0").addEventListener("pointerdown", function (e) { e.preventDefault(); escolher(0); });
$("carta1").addEventListener("pointerdown", function (e) { e.preventDefault(); escolher(1); });
$("jogar").addEventListener("pointerdown", function (e) { e.preventDefault(); comecar(); });
$("denovo").addEventListener("pointerdown", function (e) { e.preventDefault(); if (!this.disabled) comecar(); });
// Som: começa ligado; o botão 🔊/🔇 desliga e liga.
Som.ligar(CONFIG.som !== false);
Som.botao($("som"));
</script>
</body>
</html>
